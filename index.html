<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="apple-mobile-web-app-title" content="서킷타이머">
  <title>백만킬로 서킷 타이머</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/router.js"></script>
  <script type="module" src="./src/timer-view.js"></script>
</head>
<body>
  <header><h1>백만킬로 서킷 타이머</h1><p>동계 서킷</p></header>
  <main>
    <section data-panel="timer" aria-labelledby="timer-title">
      <h2 id="timer-title">타이머</h2>
      <div id="timer-active">
        <div class="choices" role="group" aria-label="세트 수"><button id="sets-2" type="button" aria-pressed="true">중등 2세트</button><button id="sets-3" type="button" aria-pressed="false">고등 3세트</button></div>
        <p id="preset-name">동계 서킷 · 7종목 × 2바퀴 × 2세트 · 총 23:05</p>
        <div class="counters"><span>남은 바퀴 <strong id="laps-left">2</strong></span><span>남은 세트 <strong id="sets-left">2</strong></span><span>종목 <strong id="station">—/7</strong></span></div>
        <div id="phase" class="phase prep"><p id="phase-label">준비</p><div id="segment-time" class="countdown" aria-label="현재 구간 남은 시간">00:05</div></div>
        <p>전체 남은 시간 <strong id="total-time">23:05</strong></p>
        <progress id="timer-progress" max="1" value="0" aria-label="전체 진행률"></progress>
        <div class="controls"><button id="start" type="button">시작</button><button id="pause" type="button" disabled>일시정지</button><button id="skip" type="button" disabled>건너뛰기</button><button id="reset" type="button" disabled>처음으로</button></div>
        <p id="device-status" class="note"></p>
      </div>
      <div id="timer-result" role="status" hidden><h3>완료</h3><p>결과 · 총 시간 <strong id="result-time">00:00</strong></p><div class="controls"><button id="again" type="button">다시 시작</button></div></div>
    </section>
    <section data-panel="presets" aria-labelledby="presets-title" hidden>
      <h2 id="presets-title">프리셋</h2><p>준비 중 · 편집과 로컬 저장은 M3에서 제공됩니다.</p>
      <ul><li>타바타 20/10 × 8</li><li>동계 서킷 30/15 · 7종목 × 2바퀴 × 2세트</li></ul>
    </section>
    <section data-panel="stopwatch" aria-labelledby="stopwatch-title" hidden>
      <h2 id="stopwatch-title">스톱워치</h2><p>준비 중</p>
    </section>
    <section data-panel="settings" aria-labelledby="settings-title" hidden>
      <h2 id="settings-title">설정</h2><p>준비 중</p><p>서버·로그인·DB 없이 기기 로컬 저장만 사용할 예정입니다.</p>
    </section>
  </main>
  <nav aria-label="주 메뉴">
    <a href="#timer" aria-current="page">타이머</a><a href="#presets">프리셋</a><a href="#stopwatch">스톱워치</a><a href="#settings">설정</a>
  </nav>
  <noscript>탭 전환에는 JavaScript가 필요합니다. 타이머 실행에도 JavaScript가 필요합니다.</noscript>
</body>
</html>
